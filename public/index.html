    const INTERACTION_JS = `(function(){
      const ST={};
      window.daimaSet=function(ts){
        Object.entries(ts).forEach(function(entry){
          var id=entry[0],t=entry[1];
          ST[id]=Object.assign({x:0,y:0,r:0,s:1,fs:100},ST[id],t);
          var el=document.querySelector('[data-daima="'+id+'"]');
          if(el)applyT(el,ST[id]);
        });
      };
      function applyT(el,t){
        el.style.transform='translate('+t.x+'px,'+t.y+'px) rotate('+t.r+'deg) scale('+(t.s||1)+')';
        if(t.fs!==undefined&&t.fs!==100){el.style.fontSize=t.fs+'%';}
        else{el.style.fontSize='';}
      }
      function notify(id){window.parent.postMessage({type:'dm-t',id:id,t:ST[id]},'*');}
      function notifyTap(id,text){window.parent.postMessage({type:'dm-tap',id:id,text:text},'*');}

      document.querySelectorAll('[data-daima]').forEach(function(el){
        var id=el.getAttribute('data-daima');
        var isText=id.indexOf('text-')===0;
        ST[id]={x:0,y:0,r:0,s:1,fs:100};
        if(window.getComputedStyle(el).position==='static')el.style.position='relative';
        if(isText)el.style.zIndex='9999';
        else if(id.indexOf('image-')===0)el.style.zIndex='1';
        var rh=document.createElement('span');
        rh.className='dm-rh';rh.textContent='↻';el.appendChild(rh);

        var mode=null,sx,sy,st,sa,moved;
        function gc(){var r=el.getBoundingClientRect();return{cx:r.left+r.width/2,cy:r.top+r.height/2};}
        function mv(cx,cy){
          if(!mode)return;
          var dx=cx-sx,dy=cy-sy;
          if(Math.sqrt(dx*dx+dy*dy)>10)moved=true; // 10px以上動いたらドラッグ扱い
          if(mode==='drag'){ST[id]={x:st.x+cx-sx,y:st.y+cy-sy,r:st.r,s:st.s||1,fs:st.fs||100};}
          else{var c=gc();var a=Math.atan2(cy-c.cy,cx-c.cx)*180/Math.PI;ST[id]={x:st.x,y:st.y,r:st.r+(a-sa),s:st.s||1,fs:st.fs||100};}
          applyT(el,ST[id]);
        }
        function end(){if(mode){if(mode==='drag'&&!moved&&isText){notifyTap(id,el.innerText);}else if(mode==='rotate'||moved){notify(id);}mode=null;}}

        el.addEventListener('mousedown',function(e){
          if(e.target===rh)return;
          mode='drag';moved=false;sx=e.clientX;sy=e.clientY;st=Object.assign({},ST[id]);el.classList.add('dm-sel');e.preventDefault();e.stopPropagation();
        });
        rh.addEventListener('mousedown',function(e){
          mode='rotate';moved=false;var c=gc();sa=Math.atan2(e.clientY-c.cy,e.clientX-c.cx)*180/Math.PI;st=Object.assign({},ST[id]);e.preventDefault();e.stopPropagation();
        });
        el.addEventListener('touchstart',function(e){
          if(e.target===rh||e.touches.length!==1)return;
          mode='drag';moved=false;sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Object.assign({},ST[id]);el.classList.add('dm-sel');e.preventDefault();
        },{passive:false});
        rh.addEventListener('touchstart',function(e){
          if(e.touches.length!==1)return;
          mode='rotate';moved=false;var c=gc();sa=Math.atan2(e.touches[0].clientY-c.cy,e.touches[0].clientX-c.cx)*180/Math.PI;st=Object.assign({},ST[id]);e.preventDefault();
        },{passive:false});
        document.addEventListener('mousemove',function(e){mv(e.clientX,e.clientY);});
        document.addEventListener('mouseup',end);
        document.addEventListener('touchmove',function(e){if(e.touches.length===1)mv(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
        document.addEventListener('touchend',end);
      });
      document.addEventListener('click',function(e){if(!e.target.closest('[data-daima]'))document.querySelectorAll('[data-daima]').forEach(function(el){el.classList.remove('dm-sel');});});
    })();`;

            if(el)el.style.display="none";
          });
          // テキスト色を再適用
          Object.entries(textColorsRef.current).forEach(([id,color])=>{
            const el=doc.querySelector('[data-daima="'+id+'"]');
            if(el&&color)el.style.color=color;
          });
          // 編集中はdm-pageのoverflow:hiddenを解除
          // → テキスト移動時にページ境界でクリップされなくなる
          // → 保存時(handleSave)に hidden に戻す
          Array.from(doc.querySelectorAll('.dm-page')).forEach(el=>{el.style.overflow='visible';});
        },150);
      },[]);

      const applyTrans=useCallback((nt)=>{
        const iw=iframeRef.current?.contentWindow;
        const doc=iframeRef.current?.contentDocument;
        if(iw?.daimaSet){
          iw.daimaSet(nt);
        } else if(doc) {
          // daimaSet未定義時のフォールバック：直接DOMを操作
          Object.entries(nt).forEach(([id,t])=>{
            const el=doc.querySelector('[data-daima="'+id+'"]');
            if(!el)return;
            el.style.transform='translate('+t.x+'px,'+t.y+'px) rotate('+t.r+'deg) scale('+(t.s||1)+')';
            el.style.fontSize=(t.fs&&t.fs!==100)?t.fs+'%':'';
          });
        }
      },[]);

      // モーダルの確定処理（テキスト更新 + フォントサイズ適用）
      const confirmEditModal=useCallback(()=>{
        if(!editModal)return;
        const num=editModal.num;
        const isAuto=!textIds.includes(num);
        const color=editModal.color||"";
        if(isAuto){
          // 自動抽出テキスト：autoTexts を更新しiframe DOMを直接書き換え
          setAutoTexts(p=>({...p,[num]:editModal.text}));
          const el=iframeRef.current?.contentDocument?.querySelector('[data-daima="text-'+num+'"]');
          if(el){
            Array.from(el.childNodes).forEach(nd=>{if(nd.nodeType===3&&nd.textContent.trim())nd.textContent=editModal.text;});
            if(color)el.style.color=color; else el.style.color="";
          }
        }else{
          // プレースホルダー方式：textVals を更新（baseHtml経由でiframeに反映）
          setTextVals(p=>({...p,[num]:editModal.text}));
        }
        // 色を保存（autoTexts・placeholder共通）
        setTextColors(p=>({...p,[editModal.id]:color}));
        const nt={...transRef.current,[editModal.id]:{...(transRef.current[editModal.id]||{x:0,y:0,r:0,s:1}),fs:editModal.fs}};
        setTrans(nt);applyTrans(nt);setEditModal(null);
      },[editModal,applyTrans,textIds]);

      const toggleHide=useCallback((elemId)=>{
        const iframe=iframeRef.current;
        setHiddenElems(prev=>{
          const isHidden=prev.includes(elemId);
          const next=isHidden?prev.filter(id=>id!==elemId):[...prev,elemId];
          if(iframe?.contentDocument){
            const el=iframe.contentDocument.querySelector(`[data-daima="${elemId}"]`);
            if(el)el.style.display=isHidden?"":"none";
          }
          return next;
        });
      },[]);

      const handleImgUpload=useCallback((id,file)=>{
        if(!file)return;
        const r=new FileReader();r.onload=e=>setImgUrls(p=>({...p,[id]:e.target.result}));r.readAsDataURL(file);
      },[]);

      // ── API呼び出し ──
      // ── HTMLからテキストを自動抽出して{{TEXT_n}}プレースホルダーに変換 ──
      // AIが{{TEXT_n}}を使わなかった場合でもテキスト編集パネルを表示できる
      // {{TEXT_n:デフォルトテキスト}} 形式からデフォルト値を抽出して {{TEXT_n}} に正規化
      const processHtmlFromAI=(html)=>{
        const texts={};
        const processed=html.replace(/\{\{TEXT_(\d+):([^}]*)\}\}/g,(_,id,def)=>{
          texts[id]=def.trim();
          return '{{TEXT_'+id+'}}';
        });
        return {html:processed,texts};
      };

      const callApi=async(system,messages)=>{
        const res=await fetch("/api/claude",{
          method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:8000,system,messages}),
        });
        if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error?.message||`HTTP ${res.status}`);}
        const data=await res.json();
        return data.content.filter(b=>b.type==="text").map(b=>b.text).join("\n")
          .replace(/^```(?:html)?\s*/i,"").replace(/\s*```\s*$/i,"").trim();
      };

      const handleGenerate=async()=>{
        setLoading(true);setLoadMsg("AIがデザインを作成中... ✨");setError("");
        try{
          const colorSpec=useAutoColor
            ?"おまかせ（佐藤心のパーソナルカラー系ピンク・スウィーティーカラーベース）"
            :`メインカラー: ${mainColor} / サブカラー: ${subColor}`;
          const filledSystem=SYSTEM_PROMPT_TEMPLATE
            .replace("{{PAGE_COUNT}}",pageCount)
            .replace("{{THEME}}",designTheme)
            .replace("{{LAYOUT_DIR}}",layoutDir)
            .replace("{{MAIN_COLOR}}",colorSpec)
            .replace("{{TEXT_CONTENT}}",textContent||"おまかせ（佐藤心らしい投票呼びかけセリフを自動生成）")
            .replace("{{ADDITIONAL_REQUEST}}",addReq||"特になし");
          systemRef.current=filledSystem;
          const msgs=[{role:"user",content:"HTMLフライヤーを生成してください。"}];
          const html=await callApi(filledSystem,msgs);
          if(!html.includes("<html")&&!html.includes("<!DOCTYPE"))throw new Error("HTMLの生成に失敗しました。もう一度お試しください。");
          setChatHist([...msgs,{role:"assistant",content:html}]);
          const {html:procHtml, texts:initTexts}=processHtmlFromAI(html);
          setRawHtml(procHtml);setTextVals(initTexts);setTrans({});setHiddenElems([]);setAutoTexts({});setAutoImgs({});setTextColors({});setScreen("edit");setActiveTab("preview");
        }catch(e){setError(e.message);}finally{setLoading(false);}
      };

      const handleRevise=async()=>{
        if(!revise.trim()||loading)return;
        setLoading(true);setLoadMsg("AIが修正中... 🔧");setError("");
        try{
          const msgs=[...chatHist,{role:"user",content:revise}];
          const html=await callApi(systemRef.current,msgs);
          setChatHist([...msgs,{role:"assistant",content:html}]);
          const {html:procHtml2, texts:initTexts2}=processHtmlFromAI(html);
          setRawHtml(procHtml2);setTextVals(initTexts2);setTrans({});setHiddenElems([]);setAutoTexts({});setAutoImgs({});setTextColors({});setRevise("");
          if(isMobile)setActiveTab("preview");
        }catch(e){setError(e.message);}finally{setLoading(false);}
      };

      // ── 保存：.dm-page 単位で個別キャプチャ（複数ページ対応） ──
      const handleSave=async()=>{
        setSaving(true);
        const captures=[];
        const iframe=iframeRef.current;
        let rhEls=[],selEls=[],imgRestores=[],whiteBgEls=[];
        try{
          if(!window.html2canvas||!iframe?.contentDocument)throw new Error("not ready");
          // ── キャプチャ前クリーンアップ ──
          // ①回転ハンドル(.dm-rh)を非表示（dm-cssは除去しない→レイアウト崩れ防止）
          rhEls=Array.from(iframe.contentDocument.querySelectorAll('.dm-rh'));
          rhEls.forEach(el=>{el.style.display='none';});
          // ②選択状態クラスを除去
          selEls=Array.from(iframe.contentDocument.querySelectorAll('.dm-sel'));
          selEls.forEach(el=>el.classList.remove('dm-sel'));
          // ③ 画像をCanvasでcover-cropしてdata URLに変換（html2canvasのobject-fit:cover非対応を回避）
          //    fetch→canvas描画→data URLとすることで、html2canvasは等倍の事前クロップ済み画像を受け取る
          const imgEls=Array.from(iframe.contentDocument.querySelectorAll(
            'img[data-daima^="image-"],[data-daima^="image-"] img'
          ));
          await Promise.all(imgEls.map(async function(img){
            var origSrc=img.getAttribute('src');
            if(!origSrc||!img.complete||img.naturalWidth===0)return;
            var w=img.offsetWidth,h=img.offsetHeight;
            if(!w||!h)return;
            var blobUrl=null;
            try{
              var imgUrl=origSrc;
              if(origSrc.indexOf('data:')!==0){
                var resp=await fetch(origSrc,{mode:'cors',credentials:'omit'});
                if(!resp.ok)return;
                blobUrl=URL.createObjectURL(await resp.blob());
                imgUrl=blobUrl;
              }
              var tmpImg=new Image();
              if(origSrc.indexOf('data:')!==0)tmpImg.crossOrigin='anonymous';
              await new Promise(function(resolve){
                tmpImg.onload=resolve;tmpImg.onerror=resolve;
                tmpImg.src=imgUrl;setTimeout(resolve,5000);
              });
              if(!tmpImg.naturalWidth||!tmpImg.naturalHeight){if(blobUrl)URL.revokeObjectURL(blobUrl);return;}
              // object-fit:coverと同等のクロップ計算
              var iw=tmpImg.naturalWidth,ih=tmpImg.naturalHeight;
              var imgAspect=iw/ih,contAspect=w/h;
              var sx,sy,sw,sh;
              if(imgAspect>contAspect){sh=ih;sw=ih*contAspect;sx=(iw-sw)/2;sy=0;}
              else{sw=iw;sh=iw/contAspect;sx=0;sy=(ih-sh)/2;}
              var cvs=document.createElement('canvas');
              cvs.width=w*2;cvs.height=h*2;
              var ctx2d=cvs.getContext('2d');
              ctx2d.imageSmoothingEnabled=true;ctx2d.imageSmoothingQuality='high';
              ctx2d.drawImage(tmpImg,sx,sy,sw,sh,0,0,cvs.width,cvs.height);
              var dataUrl=cvs.toDataURL('image/png');
              if(blobUrl){URL.revokeObjectURL(blobUrl);blobUrl=null;}
              await new Promise(function(resolve){
                img.onload=resolve;img.onerror=resolve;
                img.src=dataUrl;setTimeout(resolve,2000);
              });
              imgRestores.push({img:img,origSrc:origSrc});
            }catch(e){
              if(blobUrl)URL.revokeObjectURL(blobUrl);
              console.warn('cover-crop failed:',origSrc,e);
            }
          }));
          // ④ dm-page最下層に白背景divを挿入（透過部分の黒ずみ防止）
          Array.from(iframe.contentDocument.querySelectorAll('.dm-page')).forEach(function(pageEl){
            var bg=iframe.contentDocument.createElement('div');
            bg.style.cssText='position:absolute;inset:0;background:#ffffff;z-index:0;pointer-events:none;';
            pageEl.insertBefore(bg,pageEl.firstChild);
            whiteBgEls.push({el:pageEl,bg:bg});
          });
          // スクロールをトップにリセット
          try{
            iframe.contentWindow.scrollTo(0,0);
            iframe.contentDocument.documentElement.scrollTop=0;
            iframe.contentDocument.body.scrollTop=0;
          }catch(e){}
          // トランスフォームを再適用してDOMに確実に反映（Bug 7-4対策）
          applyTrans(transRef.current);
          // フォント・描画完了を十分に待つ
          await Promise.race([
            iframe.contentDocument.fonts.ready,
            new Promise(r=>setTimeout(r,2000))
          ]).catch(()=>{});
          await new Promise(r=>setTimeout(r,600));
          // .dm-page 要素があれば個別キャプチャ、なければドキュメント全体
          const pageEls=Array.from(iframe.contentDocument.querySelectorAll('.dm-page'));
          const targets=pageEls.length>0?pageEls:[iframe.contentDocument.documentElement];
          for(const target of targets){
            try{
              // dm-pageのoverfow:visibleで拡張されたcanvasをpx単位で手動クロップ
              // → overflow:hiddenによるクリッピングを使わず、常に正確なページ寸法に合わせる
              const pw=target.offsetWidth,ph=target.offsetHeight;
              const rawCanvas=await window.html2canvas(target,{
                useCORS:true,allowTaint:false,scale:2,logging:false,
                backgroundColor:'#ffffff',imageTimeout:15000,
                scrollX:0,scrollY:0,windowWidth:360,
              });
              // キャンバスサイズがdm-pageのサイズ(scale:2)と一致しない場合にクロップ
              const sw=pw*2,sh=ph*2;
              if(rawCanvas.width===sw&&rawCanvas.height===sh){
                captures.push(rawCanvas.toDataURL("image/png"));
              }else{
                const cropped=document.createElement('canvas');
                cropped.width=sw;cropped.height=sh;
                cropped.getContext('2d').drawImage(rawCanvas,0,0);
                captures.push(cropped.toDataURL("image/png"));
              }
            }catch(e){
              console.warn("Page capture failed:",e);
              captures.push(null);
            }
          }
        }catch(err){
          console.error("Save failed:",err);
        }finally{
          // ── キャプチャ後復元 ──
          whiteBgEls.forEach(function(o){if(o.bg.parentNode===o.el)o.el.removeChild(o.bg);});
          imgRestores.forEach(function(o){try{o.img.src=o.origSrc;}catch(e){}});
          rhEls.forEach(el=>{el.style.display='';});
          selEls.forEach(el=>el.classList.add('dm-sel'));
          setSaving(false);
        }
        setCompletedUrls(captures.length>0?captures:[null]);
        setScreen("complete");
      };

      // ══════════════════════════════════════════════
      // 画像ピッカー
      // ══════════════════════════════════════════════
      const ImagePicker=({imageId, onSelect})=>{
        const [q,setQ]=useState("");
        const nav=picNav[imageId]||{};
        const setN=(upd)=>setPicNav(p=>({...p,[imageId]:{...p[imageId],...upd}}));
        const doSelect=(url)=>{
          if(onSelect)onSelect(url);
          else setImgUrls(p=>({...p,[imageId]:url}));
          setN({setId:undefined});
        };
        const game=IMAGE_LIBRARY.find(g=>g.id===nav.gameId);
        const set=game?.sets.find(s=>s.id===nav.setId);

        if(nav.gameId&&nav.setId&&set){
          return(
            <div>
              <div style={{display:"flex",alignItems:"center",gap:"4px",fontSize:"0.71rem",marginBottom:"9px",flexWrap:"wrap"}}>
                <button onClick={()=>setN({gameId:undefined,setId:undefined})} style={{background:"none",border:"none",color:C.dark,cursor:"pointer",fontSize:"0.71rem",fontFamily:FONT,padding:0,fontWeight:"bold"}}>{game.icon} {game.label}</button>
                <span style={{color:C.gray}}>›</span>
                <button onClick={()=>setN({setId:undefined})} style={{background:"none",border:"none",color:C.dark,cursor:"pointer",fontSize:"0.71rem",fontFamily:FONT,padding:0,fontWeight:"bold"}}>{set.label}</button>
                <span style={{color:C.gray}}>›</span>
                <span style={{color:C.gray}}>種類</span>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:"7px"}}>
                {set.types.map(type=>(
                  <button key={type.id} onClick={()=>doSelect(type.url)}
                    style={{padding:0,border:`2.5px solid ${imgUrls[imageId]===type.url?C.dark:"#e0e0e0"}`,borderRadius:"9px",cursor:"pointer",background:C.white,overflow:"hidden",transition:"border-color 0.15s"}}>
                    <img src={type.url} alt={type.label} style={{width:"100%",height:"65px",objectFit:"cover",objectPosition:"top",display:"block"}} onError={e=>e.target.style.height="40px"} />
                    <div style={{fontSize:"0.73rem",color:C.dark,padding:"4px 0",fontWeight:"bold"}}>{type.label}</div>
                  </button>
                ))}
              </div>
            </div>
          );
        }

        if(nav.gameId&&!nav.setId&&game){
          const filtered=game.sets.filter(s=>s.label.includes(q)||q==="");
          return(
            <div>
              <div style={{display:"flex",alignItems:"center",gap:"4px",fontSize:"0.71rem",marginBottom:"7px"}}>
                <button onClick={()=>setN({gameId:undefined})} style={{background:"none",border:"none",color:C.dark,cursor:"pointer",fontSize:"0.71rem",fontFamily:FONT,padding:0,fontWeight:"bold"}}>{game.icon} {game.label}</button>
                <span style={{color:C.gray}}>›</span><span style={{color:C.gray}}>カードを選択</span>
              </div>
              <input value={q} onChange={e=>setQ(e.target.value)} placeholder="🔍 カード名で絞り込み..."
                style={{...inp,fontSize:"0.82rem",marginBottom:"7px",padding:"7px 10px"}} />
              <div style={{maxHeight:"200px",overflowY:"auto",display:"flex",flexDirection:"column",gap:"4px"}}>
                {filtered.length===0&&<div style={{color:C.gray,fontSize:"0.79rem",textAlign:"center",padding:"10px"}}>見つかりませんでした</div>}
                {filtered.map(s=>(
                  <button key={s.id} onClick={()=>setN({setId:s.id})}
                    style={{padding:"8px 12px",background:C.light,border:`1.5px solid ${C.pink}`,borderRadius:"9px",cursor:"pointer",textAlign:"left",fontSize:"0.82rem",color:C.text,fontFamily:FONT,display:"flex",alignItems:"center",gap:"6px"}}>
                    <span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.label}</span>
                    <span style={{color:C.gray,fontSize:"0.7rem",flexShrink:0}}>{s.types.length}種 ›</span>
                  </button>
                ))}
              </div>
            </div>
          );
        }

        return(
          <div>
            <div style={{fontSize:"0.71rem",color:C.gray,marginBottom:"8px"}}>カテゴリを選択：</div>
            <div style={{display:"flex",flexDirection:"column",gap:"5px",marginBottom:"9px"}}>
              {IMAGE_LIBRARY.map(g=>(
                <button key={g.id} onClick={()=>setN({gameId:g.id,setId:undefined})}
                  style={{padding:"9px 12px",background:C.light,border:`1.5px solid ${C.pink}`,borderRadius:"9px",cursor:"pointer",textAlign:"left",fontSize:"0.87rem",color:C.text,fontFamily:FONT,display:"flex",alignItems:"center",gap:"9px"}}>
                  <span style={{fontSize:"1.2rem"}}>{g.icon}</span>
                  <span style={{flex:1}}>{g.label}</span>
                  <span style={{color:C.gray,fontSize:"0.75rem"}}>{g.sets.length}枚 ›</span>
                </button>
              ))}
            </div>
            <label style={{display:"block",padding:"8px",textAlign:"center",border:`1.5px dashed ${C.dark}`,borderRadius:"9px",cursor:"pointer",fontSize:"0.79rem",color:C.dark,background:C.white}}>
              📁 直接アップロード
              <input type="file" accept="image/*" style={{display:"none"}} onChange={e=>{
                if(!e.target.files[0])return;
                if(onSelect){const r=new FileReader();r.onload=ev=>onSelect(ev.target.result);r.readAsDataURL(e.target.files[0]);}
                else handleImgUpload(imageId,e.target.files[0]);
              }} />

      };

      // ══════════════════════════════════════════════
      // 位置・回転・スケール・非表示コントロール
      // ══════════════════════════════════════════════
      const allElemIds=useMemo(()=>[
        ...textIds.map(id=>'text-'+id),
        ...(textIds.length===0?Object.keys(autoTexts).sort((a,b)=>+a-+b).map(n=>'text-'+n):[]),
        ...imgIds.map(id=>'image-'+id),
        ...(imgIds.length===0?Object.keys(autoImgs).sort((a,b)=>+a-+b).map(n=>'image-'+n):[]),
      ],[textIds,imgIds,autoTexts,autoImgs]);
      const allTextIds=useMemo(()=>[
        ...textIds.map(id=>'text-'+id),
        ...(textIds.length===0?Object.keys(autoTexts).sort((a,b)=>+a-+b).map(n=>'text-'+n):[]),
      ],[textIds,autoTexts]);
      const allImgIds=useMemo(()=>[
        ...imgIds.map(id=>'image-'+id),
        ...(imgIds.length===0?Object.keys(autoImgs).sort((a,b)=>+a-+b).map(n=>'image-'+n):[]),
      ],[imgIds,autoImgs]);

      const TransformPanel=({elemId})=>{
        const isText=elemId.startsWith("text-");
        const num=elemId.split("-")[1];
        const t=trans[elemId]||{x:0,y:0,r:0,s:1,fs:100};
        const isHidden=hiddenElems.includes(elemId);
        const label=isText?"テキスト "+num:"画像 "+num;
        const defaults={x:0,y:0,r:0,s:1,fs:100};
        const update=(key,val)=>{
          const nt={...transRef.current,[elemId]:{...(transRef.current[elemId]||defaults),[key]:val}};
          setTrans(nt);applyTrans(nt);
        };
        const Row=({lbl,k,min,max,step,defVal})=>{
          const val=t[k]!==undefined?t[k]:(defVal||0);
          const pct=Math.min(100,Math.max(0,((val-min)/(max-min)*100))).toFixed(1);
          const decimals=step<1?(String(step).split('.')[1]||'').length:0;
          const displayVal=parseFloat(val.toFixed(decimals));
          const applyNum=(raw)=>{const v=parseFloat(raw);if(!isNaN(v))update(k,Math.min(max,Math.max(min,v)));};
          return(
            <div style={{marginBottom:"5px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:"0.69rem",color:C.gray,marginBottom:"2px"}}>
                <span>{lbl}</span>
                <input type="number" min={min} max={max} step={step}
                  key={displayVal}
                  defaultValue={displayVal}
                  onBlur={e=>applyNum(e.target.value)}
                  onKeyDown={e=>{if(e.key==='Enter'){applyNum(e.target.value);e.target.blur();}}}
                  style={{width:"58px",padding:"1px 4px",border:"1px solid "+C.pink,borderRadius:"5px",fontSize:"0.7rem",color:C.dark,fontFamily:FONT,textAlign:"right",background:C.white}} />
              </div>
              <input type="range" min={min} max={max} step={step} value={val}
                onChange={e=>update(k,Number(e.target.value))}
                style={{width:"100%",accentColor:C.dark,cursor:"pointer",background:"linear-gradient(to right,"+C.dark+" 0%,"+C.dark+" "+pct+"%,#F0D0D8 "+pct+"%,#F0D0D8 100%)"}} />
            </div>
          );
        };
        const isAutoText=isText&&(textIds.length===0||!textIds.includes(num));
        const textContent=isText?(isAutoText?(autoTexts[num]||""):(textVals[num]||"")):"";
        const color=textColors[elemId]||"";
        const isAutoImg=!isText&&(imgIds.length===0||!imgIds.includes(num));
        const currentImgUrl=!isText?(isAutoImg?autoImgs[num]:imgUrls[num]):"";
        return(
          <div style={{background:isHidden?"#f5f5f5":C.mid,borderRadius:"10px",padding:"10px 12px",marginBottom:"8px",opacity:isHidden?0.6:1,transition:"all 0.2s"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"7px",gap:"5px",flexWrap:"wrap"}}>
              <span style={{fontSize:"0.75rem",fontWeight:"bold",color:C.dark,flex:1}}>{label}</span>
              {!isText&&currentImgUrl&&(
                <button onClick={()=>{if(isAutoImg){setAutoImgs(p=>({...p,[num]:""}));}else{setImgUrls(p=>({...p,[num]:""}));}}}

          <style>{`@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}`}</style>

      // ══════════════════════════════════════════════
      // 🔒 PIN スクリーン
      // ══════════════════════════════════════════════
      const doPin=(k)=>{
        if(k==="⌫"){if(!pinShake){setPin(p=>p.slice(0,-1));setPinErr(false);}}
        else{
          if(pin.length>=4||pinShake)return;
          const next=pin+k;setPin(next);setPinErr(false);
          if(next.length===4){
            if(next===CORRECT_PIN){setAuth(true);}
            else{setPinErr(true);setPinShake(true);setTimeout(()=>{setPin("");setPinErr(false);setPinShake(false);},900);}
          }
        }

      if(!auth){
        const KEYS=["1","2","3","4","5","6","7","8","9","","0","⌫"];
        return(
          <div style={{minHeight:"100vh",background:`linear-gradient(160deg,${C.light},#FFE6EA,#FFD6DC)`,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:FONT,padding:"20px"}}>

              <p style={{color:C.gray,fontSize:"0.79rem",margin:"0 0 26px"}}>パスワードを入力してください</p>
              <div style={{display:"flex",justifyContent:"center",gap:"14px",marginBottom:"14px"}}>

              </div>

              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"9px"}}>
                {KEYS.map((k,i)=>{if(k==="")return <div key={i}/>;return(

      // ══════════════════════════════════════════════

              </div>

              {/* ページ数（必須） */}
              <div style={{marginBottom:"18px"}}>
                <label style={{fontSize:"0.82rem",fontWeight:"bold",color:C.dark,display:"block",marginBottom:"8px"}}>
                  📄 ページ数 <span style={{color:"#e85b6e",fontSize:"0.75rem"}}>必須</span>
                </label>
                <div style={{display:"flex",gap:"8px"}}>
                  {[["1","1枚"],["2","2枚"],["3","3枚"],["4","4枚"]].map(([v,l])=>(
                    <SegBtn key={v} value={v} cur={pageCount} set={setPageCount} label={l} />
                  ))}
                </div>
              </div>

              {/* デザインテーマ */}
              <div style={{marginBottom:"18px"}}>
                <label style={{fontSize:"0.82rem",fontWeight:"bold",color:C.dark,display:"block",marginBottom:"8px"}}>🎨 デザインテーマ</label>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"6px"}}>
                  {[["王道スウィーティー（ピンク＆リボンベース）","🎀 王道\nスウィーティー"],["ポップキュート（イエロー＆星・ポップベース）","⭐ ポップ\nキュート"],["大人スウィーティー（落ち着いたピンク＆ゴールド）","✨ 大人\nスウィーティー"],["おまかせ","🌸 おまかせ"]].map(([v,l])=>(
                    <button key={v} onClick={()=>setDesignTheme(v)} style={{padding:"10px 8px",border:`1.5px solid ${designTheme===v?C.dark:C.pink}`,borderRadius:"10px",background:designTheme===v?C.pink:C.white,color:designTheme===v?C.white:C.dark,cursor:"pointer",fontSize:"0.75rem",fontWeight:designTheme===v?"bold":"normal",fontFamily:FONT,lineHeight:1.4,whiteSpace:"pre-line",transition:"all 0.2s"}}>{l}</button>
                  ))}
                </div>
              </div>

              {/* レイアウト方向性 */}
              <div style={{marginBottom:"18px"}}>
                <label style={{fontSize:"0.82rem",fontWeight:"bold",color:C.dark,display:"block",marginBottom:"8px"}}>📐 レイアウトの方向性</label>
                <div style={{display:"flex",gap:"6px"}}>
                  {[["イラスト重視（画像枠を大きく配置）","🖼 イラスト重視"],["メッセージ重視（キャッチコピーを目立たせる）","💬 メッセージ重視"],["バランス型","⚖️ バランス型"]].map(([v,l])=>(
                    <SegBtn key={v} value={v} cur={layoutDir} set={setLayoutDir} label={l} />
                  ))}
                </div>
              </div>

              {/* カラー設定 */}
              <div style={{marginBottom:"18px"}}>
                <label style={{fontSize:"0.82rem",fontWeight:"bold",color:C.dark,display:"block",marginBottom:"8px"}}>🎨 カラー設定</label>
                <div style={{display:"flex",alignItems:"center",gap:"10px",flexWrap:"wrap"}}>
                  <label style={{display:"flex",alignItems:"center",gap:"6px",fontSize:"0.82rem",color:C.text,cursor:"pointer"}}>
                    <input type="checkbox" checked={useAutoColor} onChange={e=>setUseAutoColor(e.target.checked)} style={{width:"16px",height:"16px",accentColor:C.dark}} />
                    おまかせ
                  </label>
                  {!useAutoColor&&(
                    <>
                      <label style={{display:"flex",alignItems:"center",gap:"5px",fontSize:"0.78rem",color:C.gray}}>
                        メイン
                        <input type="color" value={mainColor} onChange={e=>setMainColor(e.target.value)} />
                      </label>
                      <label style={{display:"flex",alignItems:"center",gap:"5px",fontSize:"0.78rem",color:C.gray}}>
                        サブ
                        <input type="color" value={subColor} onChange={e=>setSubColor(e.target.value)} />
                      </label>
                    </>
                  )}
                </div>
              </div>

              {/* テキスト */}
              <div style={{marginBottom:"18px"}}>
                <label style={{fontSize:"0.82rem",fontWeight:"bold",color:C.dark,display:"block",marginBottom:"5px"}}>💬 掲載したいセリフ・テキスト <span style={{fontWeight:"normal",color:C.gray,fontSize:"0.75rem"}}>（任意）</span></label>
                <p style={{fontSize:"0.74rem",color:C.gray,marginBottom:"6px"}}>空欄の場合はAIが佐藤心らしいセリフを自動生成します</p>
                <textarea value={textContent} onChange={e=>setTextContent(e.target.value)} rows={2}
                  placeholder={"例: トップまで頼むわ☆　年が年なんで☆\n例: プロデューサーとはぁとは一蓮托生☆"}
                  style={{...inp,resize:"vertical"}} />
              </div>

              {/* その他 */}
              <div style={{marginBottom:"22px"}}>
                <label style={{fontSize:"0.82rem",fontWeight:"bold",color:C.dark,display:"block",marginBottom:"5px"}}>✨ その他のこだわり <span style={{fontWeight:"normal",color:C.gray,fontSize:"0.75rem"}}>（任意）</span></label>
                <textarea value={addReq} onChange={e=>setAddReq(e.target.value)} rows={2}
                  placeholder={"例: カード名「はぁと・トゥ・ハート」のイメージで\n例: ユニット「しゅがしゅが☆み～ん」を入れて"}
                  style={{...inp,resize:"vertical"}} />
              </div>

              {error&&<div style={{marginBottom:"12px",padding:"10px 14px",background:"#fff0f0",border:"1px solid #ffcaca",borderRadius:"9px",color:"#d9534f",fontSize:"0.83rem"}}>⚠️ {error}</div>}

              <button onClick={handleGenerate} disabled={!canGen}
                style={{...PB(canGen),width:"100%",padding:"15px",fontSize:"1rem"}}>
                {loading?loadMsg:"✨ ダイマを生成する →"}
              </button>
              <p style={{textAlign:"center",color:C.gray,fontSize:"0.71rem",marginTop:"10px"}}>Ctrl+Enter でも生成できます</p>
            </div>
          </div>
        );
      }

      // ══════════════════════════════════════════════
      // 🎉 完成画面（複数ページ対応）
      // ══════════════════════════════════════════════
      if(screen==="complete"){
        const hasAnyUrl=completedUrls.some(u=>u);
        const pageCount=completedUrls.length;
        return(
          <div style={{height:"100vh",display:"flex",flexDirection:"column",fontFamily:FONT,background:"#f0f0f0"}}>
            <div style={{background:"linear-gradient(135deg,"+C.pink+","+C.dark+")",padding:"14px 20px",textAlign:"center",flexShrink:0,boxShadow:"0 2px 12px rgba(212,128,147,0.3)"}}>
              <h2 style={{color:C.white,fontSize:"1.3rem",margin:"0 0 4px"}}>
                {"🎉 作成完了！"+(pageCount>1?" ("+pageCount+"枚)":"")}
              </h2>
              <p style={{color:"rgba(255,255,255,0.85)",fontSize:"0.8rem",margin:0}}>
                {hasAnyUrl?"下の画像を長押し（スマホ）または右クリック（PC）で保存してください":"スクリーンショットで保存してください"}
              </p>
            </div>

            <div style={{flex:1,overflow:"auto",padding:"20px",display:"flex",flexDirection:"column",alignItems:"center",gap:"24px"}}>
              {completedUrls.map((url,i)=>url?(
                <div key={i} style={{maxWidth:"400px",width:"100%"}}>
                  {pageCount>1&&(
                    <div style={{textAlign:"center",fontSize:"0.82rem",fontWeight:"bold",color:C.dark,marginBottom:"8px",letterSpacing:"0.05em"}}>
                      {"— "+(i+1)+"枚目 —"}
                    </div>
                  )}
                  <div style={{borderRadius:"20px",overflow:"hidden",boxShadow:"0 12px 40px rgba(0,0,0,0.2)"}}>
                    <img src={url} alt={"ダイマ "+(i+1)+"枚目"} style={{width:"100%",display:"block"}} />
                  </div>
                  <div style={{textAlign:"center",marginTop:"8px"}}>
                    <a href={url} download={"daima_"+(i+1)+".png"} style={{fontSize:"0.78rem",color:C.gray,textDecoration:"underline"}}>
                      {"うまく保存できない場合はここをタップ"+(pageCount>1?" ("+(i+1)+"枚目)":"")}
                    </a>
                  </div>
                </div>
              ):(
                <div key={i} style={{maxWidth:"400px",width:"100%",background:C.white,borderRadius:"16px",padding:"28px 24px",boxShadow:"0 8px 30px rgba(0,0,0,0.1)",textAlign:"center"}}>
                  {pageCount>1&&<div style={{fontSize:"0.82rem",fontWeight:"bold",color:C.dark,marginBottom:"8px"}}>{(i+1)+"枚目"}</div>}
                  <div style={{fontSize:"2.5rem",marginBottom:"12px"}}>📸</div>
                  <p style={{color:C.dark,fontWeight:"bold",marginBottom:"8px",fontSize:"0.95rem"}}>自動キャプチャに失敗しました</p>
                  <p style={{color:C.gray,fontSize:"0.82rem",lineHeight:1.7}}>
                    外部画像のCORS制限により自動キャプチャができませんでした。<br/>
                    「編集に戻る」→ プレビューのスクリーンショットをご利用ください。
                  </p>
                </div>
              ))}
            </div>

            <div style={{background:C.white,padding:"16px 20px",flexShrink:0,boxShadow:"0 -2px 12px rgba(212,128,147,0.15)"}}>
              <div style={{background:C.mid,borderRadius:"12px",padding:"12px 16px",marginBottom:"14px",fontSize:"0.82rem",color:C.dark,lineHeight:1.7}}>
                <div>{"📱 スマホ: 画像を長押し → 「写真に保存」"+(pageCount>1?" ×"+pageCount+"枚":"")}</div>
                <div>{"💻 PC: 画像を右クリック → 「名前を付けて画像を保存」"}</div>
              </div>
              <div style={{display:"flex",gap:"10px"}}>
                <button onClick={()=>setScreen("edit")} style={{...SB(true),flex:1,padding:"12px",fontSize:"0.92rem"}}>
                  ← 編集に戻る
                </button>
                <button onClick={()=>{setScreen("prompt");setRawHtml("");setTrans({});setHiddenElems([]);setChatHist([]);setCompletedUrls([]);}}
                  style={{...PB(true),flex:1,padding:"12px",fontSize:"0.92rem"}}>
                  🌸 新しく作る
                </button>
              </div>
            </div>
          </div>
        );
      }

      // ══════════════════════════════════════════════
      // ✏️ 編集スクリーン（モバイル）
      // ── ヘッダー・フッターをposition:fixedで固定 ──
      // ══════════════════════════════════════════════
      if(isMobile){
        return(
          <div style={{height:"100vh",overflow:"hidden",fontFamily:FONT,position:"relative"}}>
            {TextEditModal}
            {loadOverlay}
            <div style={{position:"fixed",top:0,left:0,right:0,height:"52px",zIndex:100}}>
              {editHeader}
            </div>
            <div style={{position:"fixed",top:"52px",left:0,right:0,bottom:"52px",overflow:"hidden",display:"flex",flexDirection:"column"}}>
              {activeTab==="edit"?controlsPanel:previewPanel}
            </div>
            <div style={{position:"fixed",bottom:0,left:0,right:0,height:"52px",zIndex:100,display:"flex",background:C.white,borderTop:`1px solid ${C.mid}`,boxShadow:"0 -2px 10px rgba(212,128,147,0.15)"}}>
              {[{key:"edit",label:"✍️ 編集"},{key:"preview",label:"📱 プレビュー"}].map(tab=>(
                <button key={tab.key} onClick={()=>setActiveTab(tab.key)} style={{flex:1,padding:"14px 0",background:"none",border:"none",color:activeTab===tab.key?C.dark:C.gray,fontWeight:activeTab===tab.key?"bold":"normal",fontSize:"0.9rem",cursor:"pointer",borderTop:activeTab===tab.key?`3px solid ${C.dark}`:"3px solid transparent",transition:"all 0.2s",fontFamily:FONT}}>
                  {tab.label}
                </button>
              ))}
            </div>
          </div>
        );
      }

      // ══════════════════════════════════════════════
      // ✏️ 編集スクリーン（デスクトップ）
      // ══════════════════════════════════════════════
      return(
        <div style={{height:"100vh",display:"flex",flexDirection:"column",fontFamily:FONT,background:"#ebebeb",overflow:"hidden"}}>
          {TextEditModal}
          {loadOverlay}
          {editHeader}
          <div style={{flex:1,display:"flex",overflow:"hidden"}}>
            {controlsPanel}
            {previewPanel}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<DaimaCreator />);
  </script>
</body>
</html>
